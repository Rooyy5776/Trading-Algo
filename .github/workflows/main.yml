name: Deploy Apex Bot to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Copy files to EC2
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        source: "."
        target: "/home/ubuntu/apex-bot"

    - name: Install Dependencies
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          cd /home/ubuntu/apex-bot
          
          # Ubuntu में पाइथन के जरूरी टूल्स इंस्टॉल करना
          sudo apt update -y
          sudo apt install -y python3-venv python3-pip
          
          # वर्चुअल एनवायरनमेंट बनाना
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          
          # लाइब्रेरीज़ इंस्टॉल करना
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
